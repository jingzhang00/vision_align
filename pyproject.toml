[project]
name = "vision-align"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "av>=15.0.0",
    "einops>=0.8.1",
    "ftfy==6.1.1",
    "h5py>=3.16.0",
    "huggingface-hub",
    "imageio[ffmpeg]>=2.37.0",
    "iopath>=0.1.10",
    "mink>=0.0.13",
    "matplotlib>=3.10.0",
    "mujoco>=3.10.0",
    "numpy>=1.26,<2",
    "nvitop>=1.7.1",
    "pycocotools>=2.0.10",
    "regex",
    "requests>=2.32.0",
    "sam3",
    "scipy>=1.14.0",
    "timm>=1.0.17",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "tqdm",
    "typing-extensions==4.12.2",
    "opencv-python>=4.11.0.86",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
exclude-dependencies = [
    { package = { name = "isaacsim-core", version = "5.1.0.0" }, dependencies = ["pywin32"] },
]

[tool.uv.sources]
sam3 = { path = "sam3", editable = true }
